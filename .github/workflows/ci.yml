name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      # The locked ruff, not whatever uvx resolves today: a new release adds
      # rules and reformats code, and CI would disagree with "uv run ruff".
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Bandit
        run: uv run bandit -r src/ -c pyproject.toml

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      # mypy runs in the project environment. Outside it, roomkit and the
      # backend SDKs resolve to Any (pyproject ignores their missing imports),
      # so no call into them is checked, and numpy is not found at all.
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Mypy
        run: uv run mypy src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Qt/audio system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libportaudio2 libpulse0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Pytest
        run: uv run pytest -v

  # Every other job runs on Linux, where a Unix-only module imports fine and a
  # release ships to Windows unexecuted. Importing the entry point is the first
  # thing the packaged .exe does, and the cheapest place to catch that.
  windows-import:
    name: Windows import
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      # Deliberately bare: this installs the core only, so the job doubles as
      # the check that the app still starts with every backend extra absent.
      - name: Install dependencies
        run: uv sync

      - name: Import the app
        run: uv run python -c "import roomkit_ui.app"

      # Exercises every feature probe. A typo in features.py that raises on a
      # missing module would take the whole app down on a core install.
      - name: Report available features
        run: uv run roomkit-ui --doctor
