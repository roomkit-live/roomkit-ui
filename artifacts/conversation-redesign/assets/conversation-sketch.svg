"600">RoomKit</text><text x="379" y="320" font-size="14" fill="#52455f">One place to write, show and talk.</text><rect x="379" y="342" width="358" height="6" rx="3" fill="#e6dfed"/><rect x="379" y="358" width="395" height="6" rx="3" fill="#e6dfed"/><rect x="379" y="374" width="312" height="6" rx="3" fill="#e6dfed"/><rect x="379" y="404" width="432" height="54" rx="10" fill="#f9f6fe" stroke="#e7dff3"/><text x="397" y="426" font-size="11" fill="#7053a8">The image and its answer stay together.</text><text x="397" y="445" font-size="10" fill="#9585a7">Open the detail only when you need it.</text><rect x="323" y="509" width="623" height="108" rx="21" fill="#f7f5fa" stroke="#dfd7eb"/><text x="345" y="542" font-size="13" fill="#aa9eb6">Ask anything, or show me something…</text><text x="344" y="588" font-size="24" fill="#897199">＋</text><text x="381" y="583" font-size="10" fill="#a18fae">Text, images &amp; voice</text><rect x="824" y="564" width="102" height="35" rx="17" fill="#eae0f9"/><text x="844" y="586" font-size="12" fill="#7852b6">▥ Go Live</text><g fill="#7653b7"><circle cx="964" cy="175" r="15"/><circle cx="850" cy="322" r="15"/><circle cx="975" cy="555" r="15"/></g><g fill="#fff" font-size="13" text-anchor="middle"><text x="964" y="180">1</text><text x="850" y="327">2</text><text x="975" y="560">3</text></g></g></svg>
